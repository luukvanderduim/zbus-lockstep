# git-cliff ~ default configuration file
# https://git-cliff.org/docs/configuration

[changelog]
# changelog header
header = """
# zbus-lockstep Changelog\n
All notable changes to this project will be documented in this file.\n
"""
# template for the changelog body
# https://keats.github.io/tera/docs/#introduction
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | split(pat="\n") | first | upper_first }} \
            ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/luukvanderduim/zbus-lockstep/commit/{{ commit.id }}))\
    {% endfor %}
{% endfor %}\n
"""
# template for the changelog footer
footer = """
<!-- generated by git-cliff -->
"""
# remove the leading and trailing s
trim = true
# postprocessors
postprocessors = [
  { pattern = 'git@github.com:luukvanderduim/zbus-lockstep.git', replace = "https://github.com/luukvanderduim/zbus-lockstep" }, # replace repository URL
]

[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# filter out the commits that are not conventional
filter_unconventional = false
# process each line of a commit as an individual commit
split_commits = false
# regex for preprocessing the commit messages
commit_preprocessors = [
  # Replace PR/issue numbers (e.g. "(#12)") with active GitHub links
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/luukvanderduim/zbus-lockstep/pull/${2}))" },
]
# regex for parsing and grouping commits
commit_parsers = [
  # NOTE: first match wins — keep the narrow skip rules above the broad ones.
  # `(?:\S+\s+)?` tolerates a leading emoji token, `(?i)` ignores case.

  { message = '(?i)^(?:\S+\s+)?chore\((release|deps|pr|pull)', skip = true },

  { message = '💥|^:boom:', group = "<!-- 2 -->💥 Breaking change" },
  { message = '^🎉|^:tada:|(?i)^initial commit', group = "<!-- 0 -->🎉 Begin project" },
  { message = '🔒️|🔐|:lock:|:key:', group = "<!-- 10 -->🔒️ Security / Secrets" },

  { message = '(?i)^(?:\S+\s+)?feat|^✨|^:sparkles:', group = "<!-- 1 -->✨ Features" },
  { message = '(?i)^(?:\S+\s+)?fix|^🐛|^:bug:|^🚑️|^:ambulance:|^🩹|^:adhesive_bandage:', group = "<!-- 3 -->🐛 Fixes" },
  { message = '(?i)^(?:\S+\s+)?docs?|^📝|^:memo:', group = "<!-- 4 -->📝 Documentation" },
  { message = '(?i)^(?:\S+\s+)?perf|^⚡|^:zap:', group = "<!-- 5 -->⚡ Performance" },
  { message = '(?i)^(?:\S+\s+)?refactor|^♻️|^:recycle:|^🚚|^:truck:', group = "<!-- 6 -->♻️ Refactor / Move files" },
  { message = '(?i)^(?:\S+\s+)?style|^💄|^:lipstick:|^🎨|^:art:', group = "<!-- 7 -->💄 Art and Style" },
  { message = '(?i)^(?:\S+\s+)?tests?|^✅|^:white_check_mark:|^🧪|^:test_tube:|^🦺|^:safety_vest:', group = "<!-- 8 -->✅ Testing and validation" },

  { message = '⬆️|(?i)^(?:\S+\s+)?(deps|dependencies)', group = "<!-- 12 -->⬆️ Dependencies" },
  { message = '(?i)^(?:\S+\s+)?(build|ci|chore)|^⚙️|^:gear:', group = "<!-- 9 -->⚙️ Miscellaneous Tasks" },

  { message = '^⏪️|^:rewind:|🔥|^:fire:', group = "<!-- 11 -->⏪️ Revert / Remove" },
  { message = '(?i)^(?:\S+\s+)?alien|^👽️|^:alien:', group = "<!-- 13 -->👽️ External API changes" },
  { message = '(?i)^(?:\S+\s+)?wheelchair|^♿️|^:wheelchair:', group = "<!-- 15 -->♿️ Accessibility" },
  { message = '(?i)^(?:\S+\s+)?children_crossing|^🚸|^:children_crossing:', group = "<!-- 16 -->🚸 Improve UX" },
  { message = '(?i)^(?:\S+\s+)?iphone|^🧑‍💻|^:technologist:', group = "<!-- 17 -->🧑‍💻 Improve DX" },
  { message = '(?i)^(?:\S+\s+)?triangular_flag_on_post|^🚩|^:triangular_flag_on_post:', group = "<!-- 18 -->🚩 Feature flags" },
  { message = '(?i)^(?:\S+\s+)?thread|^🧵|^:thread:', group = "<!-- 19 -->🧵 Multithreading / Concurrency" },

  # Safety net: a commit that matched nothing used to vanish from the changelog,
  # because the body template's `group_by` skips items without a `group`.
  { message = '.*', group = "<!-- 20 -->🔖 Other" },
]

# protect breaking changes from being skipped due to matching a skipping commit_parser
protect_breaking_commits = false
# filter out the commits that are not matched by commit parsers
filter_commits = false
# regex for matching git tags
tag_pattern = "v[0-9].*"
# regex for skipping tags
# skip_tags = ""
# regex for ignoring tags
# ignore_tags = ""
# sort the tags topologically
topo_order = false
# sort the commits inside sections by oldest/newest order
sort_commits = "oldest"

[remote.github]
owner = "luukvanderduim"
repo = "zbus-lockstep"
